name: Build IQ Crosshair V2 EXE
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name IQ-Crosshair-V2 main.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: IQ-Crosshair-V2-Windows
          path: dist/IQ-Crosshair-V2.exe
          if-no-files-found: error
